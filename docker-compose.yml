# Local infrastructure for development. Production uses managed Postgres/Redis.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USER:-housing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-housing}
      POSTGRES_DB: ${DB_NAME:-housing}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-housing}']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
